name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify GitHub workflow identity context
        env:
          WORKFLOW_JOB: ${{ toJSON(job) }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          job = json.loads(os.environ["WORKFLOW_JOB"])
          assert job["workflow_repository"] == "DobbyVPN/fdroid-repo"
          assert job["workflow_sha"] == os.environ["SOURCE_SHA"]
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: publisher
          persist-credentials: false
      - name: Check out product validators
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: DobbyVPN/DobbyVPN
          ref: 28ecf48514c90a0f66926b1aba650a3756db7b73
          path: DobbyVPN
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir -r publisher/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: publisher
